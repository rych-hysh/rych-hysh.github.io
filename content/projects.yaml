# Tottoki・みんなでウミガメ・Typing Game v2は本人のプロダクト。sample: true の作品は架空の記入例です。
# 実際の作品への差し替え方・画像の置き方は docs/projects.md を参照。
# published: true の作品だけ表示します（省略時は false）。
# 非公開情報や未承認の画像は、このリポジトリに保存しないでください。
- id: tottoki
  published: true
  sample: false
  name: Tottoki（とっとき）
  summary: |-
    InstagramやGoogleマップで見つけた「いつか行きたい場所」を、ひとつにまとめて保存するiPhoneアプリ。
    地図やカレンダーで見返し、保存した場所を旅行の行程につなげます。
  role: 個人開発
  status: iPhoneアプリ
  features:
    - 共有メニューから、アプリを開かずに場所やイベントを保存
    - 保存した場所は地図で、イベントの開催日はカレンダーで確認
    - 保存した場所から日ごとの旅行の行程を作成し、友だちと共有
  links:
    - label: Tottokiの公式サイトを見る
      url: https://tottoki.hryoichi.com/
  screenshot:
    file: tottoki-og.png
    alt: Tottokiの公式紹介画像。「行きたいを、とっとく。」というメッセージとアプリアイコン。
    caption: Tottoki — 行きたいを、とっとく。

- id: umigame
  published: true
  sample: false
  name: みんなでウミガメ
  summary: |-
    AIがゲームマスターを務める「ウミガメのスープ」のiPhone向けアプリ（公開前）。
    「はい・いいえ」で答えられる質問を重ね、ふしぎな話の真相を推理。ひとりでも、友だちと一緒でも楽しめます。
  role: 個人開発
  status: iPhone向けアプリ / 公開前
  features:
    - AIが出題・質問への回答・真相の判定を担当
    - ひとりでじっくり推理し、途中でやめても続きから再開
    - 5桁の部屋コードで集まり、質問や回答を共有しながらみんなで推理
  links:
    - label: みんなでウミガメの紹介サイトを見る
      url: https://umigame.hryoichi.com/
  screenshot:
    file: umigame-icon.png
    alt: みんなでウミガメの公式アプリアイコン。青い海の中を泳ぐウミガメのシルエット。
    caption: みんなでウミガメ

- id: typing-game
  published: true
  sample: false
  name: Typing Game v2
  summary: |-
    学習用に制作した、最初期の個人プロダクト。
    フレームワークを使わず、HTML5・CSS3・JavaScriptのみで実装した、PC専用のタイピングゲームです。
  role: 個人開発
  status: Webゲーム / PCのみ対応
  features:
    - Enterキーでプレイを開始し、Escキーでタイトル画面へ戻るシンプルな操作
    - 平均KPM（1分間のキー入力回数）と正確率からスコアを計算
    - プレイ後にランク・入力速度・正確率を結果画面で確認
  stack: [HTML5, CSS3, JavaScript]
  links:
    - label: タイピングゲームで遊ぶ
      url: https://typing.hryoichi.com/
  screenshot:
    file: typing-game.png
    alt: Typing Game v2のタイトル画面。グラデーションのパネルにゲーム名とPLAYボタンを表示。
    caption: 公開中のタイトル画面

