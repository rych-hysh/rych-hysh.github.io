# 旅行先（上から順に地球儀のアークでつながります。近い場所どうしを並べると線がきれい）
# region は国名や地方名（地名と同じなら省略表示）。lat / lng は緯度・経度。Google マップで場所を右クリックするとコピーできます
# 日本国内の場所にマウスを乗せると、地球儀が日本にズームインします
# id は場所へのリンク用。変更しないでください。description / photos は省略できます。
# 写真は content/travel/ に置き、file / alt / caption を登録（詳しくは docs/travel-photos.md）。

